name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-ci:
    name: 🛡️ Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore SurveyManagementSystem.slnx

      - name: 🔨 Build Solution
        run: dotnet build SurveyManagementSystem.slnx --no-restore --configuration Release

      - name: 🧪 Run Unit & Integration Tests
        run: dotnet test SurveyManagementSystem.slnx --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: 🌐 Frontend Lint, Test & Build (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🧪 Run Vitest Unit Tests
        run: npm test

      - name: 🔨 Build Production Bundle
        run: npm run build
